name: "CodeQL Advanced Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure future JS/TS code cannot be silently unscanned
        shell: bash
        run: |
          if git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' '*.ts' '*.tsx' | grep -q .; then
            echo "::error::JavaScript/TypeScript source added: enable a JS/TS CodeQL matrix job."
            exit 1
          fi
      - name: Initialize Python CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Perform Python CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
