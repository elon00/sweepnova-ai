name: Security Fail-Closed Negative Regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify forged proofs and fake RPC success are rejected
        run: python -m unittest discover -s tests -p 'test_security_fail_closed.py' -v
